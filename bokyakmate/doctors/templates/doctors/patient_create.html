{% extends "doctors/base.html" %}
{% block title %}환자 등록 · 복약메이트{% endblock %}
{% block content %}

<div class="page-header">
    <h1>환자 등록</h1>
    <a href="{% url 'doctors:patient_list' doctor.member_id %}" class="back-link">← 목록으로</a>
</div>

<div class="card">
    <form method="post">
        {% csrf_token %}
        <div class="form-group"><label>환자ID</label><input type="text" name="patient_id" required></div>
        <div class="form-group"><label>로그인 아이디</label><input type="text" name="username" required></div>
        <div class="form-group"><label>초기 비밀번호</label><input type="password" name="password" required></div>
        <div class="form-group"><label>이름</label><input type="text" name="name" required></div>
        <div class="form-group">
            <label>성별</label>
            <select name="gender">
                <option value="F">여성</option>
                <option value="M">남성</option>
                <option value="U">선택 안함</option>
            </select>
        </div>
        <div class="form-group"><label>생년월일</label><input type="date" name="birth_date" required></div>
        <button type="submit" class="btn">등록하기</button>
    </form>
</div>

{% endblock %}
