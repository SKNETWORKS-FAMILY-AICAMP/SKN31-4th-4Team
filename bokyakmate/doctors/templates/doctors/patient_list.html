{% extends "doctors/base.html" %}
{% block title %}환자 목록 · 복약메이트{% endblock %}
{% block content %}

<div class="page-header">
    <h1>환자 목록</h1>
    <a href="{% url 'doctors:patient_create' doctor.member_id %}" class="btn">+ 환자 등록</a>
</div>

<form class="search-row" method="get">
    <input type="text" name="q" placeholder="환자 이름으로 검색" value="{{ query }}">
    <button type="submit" class="btn secondary">검색</button>
</form>

<table class="data-table">
    <thead>
        <tr><th>환자ID</th><th>이름</th><th>성별</th><th>나이</th></tr>
    </thead>
    <tbody>
        {% for p in patients %}
        <tr class="clickable" onclick="location.href='{% url "doctors:patient_detail" doctor.member_id p.patient_id %}'">
            <td>{{ p.patient_id }}</td>
            <td>{{ p.name }}</td>
            <td>{{ p.get_gender_display }}</td>
            <td>{{ p.age }}세</td>
        </tr>
        {% empty %}
        <tr><td colspan="4" class="empty-state">등록된 환자가 없어요.</td></tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
