{% extends "doctors/base.html" %}
{% block title %}새 처방 등록{% endblock %}
{% block content %}

<div class="page-header">
    <h1>새 처방 등록 — {{ patient.name }}</h1>
    <a href="{% url 'doctors:patient_detail' doctor.member_id patient.patient_id %}" class="back-link">← 환자 상세로</a>
</div>

<div class="card">
    <form method="post">
        {% csrf_token %}
        <div class="form-group"><label>처방ID</label><input type="text" name="prescription_id" required></div>
        <div class="form-group"><label>진단명</label><input type="text" name="diagnosis" placeholder="예: 조현병"></div>
        <div class="form-group"><label>처방일자</label><input type="date" name="prescribed_at" required></div>
        <button type="submit" class="btn">처방 생성하고 약 추가하기</button>
    </form>
</div>

{% endblock %}
