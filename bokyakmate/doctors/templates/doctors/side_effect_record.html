{% extends "doctors/base.html" %}
{% block title %}부작용 기록{% endblock %}
{% block content %}

<div class="page-header">
    <h1>부작용 기록 — {{ detail.drug.drug_name }}</h1>
    <a href="{% url 'doctors:prescription_detail' doctor.member_id detail.prescription.prescription_id %}" class="back-link">← 처방 상세로</a>
</div>

<div class="card">
    <form method="post">
        {% csrf_token %}
        <div class="form-group"><label>증상</label><input type="text" name="symptom" placeholder="예: 두통, 발진" required></div>
        <div class="form-group">
            <label>정도</label>
            <div class="severity-options">
                <label><input type="radio" name="severity" value="low" checked><span>낮음</span></label>
                <label><input type="radio" name="severity" value="mid"><span>중간</span></label>
                <label><input type="radio" name="severity" value="high"><span>높음</span></label>
            </div>
        </div>
        <button type="submit" class="btn" style="margin-top:10px;">저장</button>
    </form>
</div>

{% endblock %}
