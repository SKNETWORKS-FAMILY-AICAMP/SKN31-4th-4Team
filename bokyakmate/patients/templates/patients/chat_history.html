{% load static %}
{% load patient_tags %}
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>상담 히스토리 · 복약메이트</title>
<link rel="stylesheet" href="{% static 'patients/css/main.css' %}">
</head>
<body>

<div class="phone">
    <div class="subpage-header">
        <a href="{{ main_url }}">←</a>
        <h1>상담 히스토리</h1>
    </div>

    <div class="subpage-body scroll-body">
        {% for chat in chats %}
        <a href="{% url 'patients:chat_history_detail' patient.patient_id chat.pk %}" class="record-card record-card-link">
            <div class="title">{{ chat.get_intent_display|default:"상담 기록" }}</div>
            <div class="meta">{{ chat.started_at|date:"Y.m.d H:i" }}{% if chat.status == "active" %} · 진행중{% endif %}</div>
        </a>
        {% empty %}
        <div class="empty-state">아직 상담 기록이 없어요.</div>
        {% endfor %}
    </div>
    <div>
        {% bottom_nav "records" %}
    </div>
</div>

</body>
</html>
