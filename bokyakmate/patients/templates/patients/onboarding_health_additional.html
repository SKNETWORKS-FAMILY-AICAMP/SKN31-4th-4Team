{% load static %}
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>건강 정보 입력 · 복약메이트</title>
    <link rel="stylesheet" href="{% static 'patients/css/main.css' %}">
</head>

<body>

    <div class="phone">
        <div class="subpage-header">
            <h1>건강 정보 입력</h1>
        </div>

        <div class="onb-body">
            <p class="onb-sub" style="margin-top:6px;">추가적인 건강 상태를 알려주세요 (선택).</p>

            <form method="post">
                {% csrf_token %}

                <p class="onb-field-label">기저질환 (복수 선택 가능)</p>
                <div style="margin-bottom:18px;">
                    <label class="tag-check"><input type="checkbox" name="conditions" value="고혈압">고혈압</label>
                    <label class="tag-check"><input type="checkbox" name="conditions" value="당뇨">당뇨</label>
                    <label class="tag-check"><input type="checkbox" name="conditions" value="간질환">간질환</label>
                    <label class="tag-check"><input type="checkbox" name="conditions" value="신장질환">신장질환</label>
                    <label class="tag-check"><input type="checkbox" name="conditions" value="심혈관질환">심혈관질환</label>
                    <label class="tag-check"><input type="checkbox" name="conditions" value="알레르기">알레르기</label>
                    <label class="tag-check"><input type="checkbox" name="conditions" value="기타"
                            id="cond-etc">기타</label>
                </div>
                <input type="text" name="condition_etc" class="onb-input" placeholder="기타 기저질환을 입력해주세요"
                    style="display:none;" id="cond-etc-input">
                <!-- ================= 알레르기 입력 섹션 ================= -->
                <!-- <p class="onb-field-label">알레르기 (복수 선택 가능)</p>
                <div style="margin-bottom:18px;">
                    <label class="tag-check"><input type="checkbox" name="allergies" value="갑각류">갑각류</label>
                    <label class="tag-check"><input type="checkbox" name="allergies" value="견과류">견과류</label>
                    <label class="tag-check"><input type="checkbox" name="allergies" value="페니실린">페니실린</label>
                    <label class="tag-check"><input type="checkbox" name="allergies" value="아스피린">아스피린</label>
                    <label class="tag-check"><input type="checkbox" name="allergies" value="소염진통제">소염진통제</label>
                    <label class="tag-check"><input type="checkbox" name="allergies" value="항생제">항생제</label>
                    <label class="tag-check"><input type="checkbox" name="allergies" value="기타" id="allergy-etc">기타</label>
                </div> -->
<!-- 
                <input type="text" name="allergy_etc" class="onb-input" placeholder="기타 알레르기를 입력해주세요"
                    style="display:none; margin-bottom:18px;" id="allergy-etc-input"> -->

                {% if patient.gender == "F" %}
                <div class="onb-toggle-row">
                    <span class="label">임신 여부</span>
                    <label class="onb-switch">
                        <input type="checkbox" name="is_pregnant">
                        <span class="track"></span>
                    </label>
                </div>
                {% endif %}

                <button type="submit" class="onb-btn-primary">완료</button>
            </form>
        </div>
    </div>
    <script>
        // 기타 기저질환 선택 시에만 직접입력 인풋 노출
        document.getElementById('cond-etc').addEventListener('change', function () {
            document.getElementById('cond-etc-input').style.display = this.checked ? 'block' : 'none';
        });
        // 기타 알레르기 선택 시 직접 입력 인풋 노출 토글
        // document.getElementById('allergy-etc').addEventListener('change', function () {
        //     document.getElementById('allergy-etc-input').style.display = this.checked ? 'block' : 'none';
        // });
    </script>

</body>

</html>
