{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>건강 정보 입력 · 복약메이트</title>
<link rel="stylesheet" href="{% static 'patients/css/main.css' %}">
</head>
<body>

<div class="phone">
    <div class="subpage-header">
        <h1>건강 정보 입력</h1>
    </div>

    <div class="onb-body">
        <p class="onb-sub" style="margin-top:6px;">
            정확한 복약 모니터링을 위해<br>현재 건강 상태를 알려주세요.
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="onb-time-grid">
                <div>
                    <p class="onb-field-label">키 (cm)</p>
                    <input type="number" name="height_cm" class="onb-input" placeholder="170" step="0.1">
                </div>
                <div>
                    <p class="onb-field-label">몸무게 (kg)</p>
                    <input type="number" name="weight_kg" class="onb-input" placeholder="60" step="0.1">
                </div>
            </div>

            <div class="onb-time-grid">
                <div>
                    <p class="onb-field-label">평균 취침시간</p>
                    <input type="time" name="sleep_time" class="onb-input">
                </div>
                <div>
                    <p class="onb-field-label">평균 기상시간</p>
                    <input type="time" name="wake_time" class="onb-input">
                </div>
            </div>

            <p class="onb-field-label" style="margin-top:10px;">식사 습관</p>
            <div class="onb-radio-group">
                <label class="onb-radio-pill"><input type="radio" name="eating_habit" value="regular">규칙적</label>
                <label class="onb-radio-pill"><input type="radio" name="eating_habit" value="irregular">불규칙적</label>
                <label class="onb-radio-pill"><input type="radio" name="eating_habit" value="two_or_less">하루 2끼 이하</label>
                <label class="onb-radio-pill"><input type="radio" name="eating_habit" value="frequent_skip">식사를 자주 거름</label>
            </div>

            <div class="onb-toggle-row">
                <span class="label">흡연 여부</span>
                <label class="onb-switch">
                    <input type="checkbox" name="is_smoking">
                    <span class="track"></span>
                </label>
            </div>

            <button type="submit" class="onb-btn-primary">다음</button>
        </form>
    </div>
</div>

</body>
</html>
