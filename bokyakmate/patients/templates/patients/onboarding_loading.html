{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>정보 조회 중 · 복약메이트</title>
<link rel="stylesheet" href="{% static 'patients/css/main.css' %}">
</head>
<body>

<div class="phone">
    <div class="onb-loading">
        <div class="onb-spinner"></div>
        <div class="onb-loading-steps">
            <!-- {# step: 현재 진행 단계(1~3) — 백엔드에서 순차 처리 후 값 전달, 또는 JS 타이머로 순차 표시 #} -->
            <p class="onb-loading-step {% if step >= 1 %}active{% endif %}">
                {{ selected_hospital.hospital_name|default:"병원" }}에서 환자 정보를 조회중입니다
            </p>
            <p class="onb-loading-step {% if step >= 2 %}active{% endif %}">
                확인했습니다. {{ patient_name|default:"환자" }}님 반갑습니다
            </p>
            <p class="onb-loading-step {% if step >= 3 %}active{% endif %}">
                진료 내역 및 처방내역을 불러오고 있습니다
            </p>
        </div>
    </div>
</div>

{# 데모용: 2초 후 자동으로 다음 화면(정보 확인)으로 이동.
   실제로는 백엔드가 조회를 마치는 시점에 맞춰 redirect하면 된다. #}
<script>
setTimeout(function () {
    window.location.href = "{% url 'patients:onboarding_info_confirm' %}";
}, 2000);
</script>

</body>
</html>
